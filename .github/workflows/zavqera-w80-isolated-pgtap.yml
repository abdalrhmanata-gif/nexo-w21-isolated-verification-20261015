name: ZAVQERA W80 Isolated PostgreSQL 17 pgTAP

on:
  workflow_dispatch:
  push:
    branches:
      - codex/mission-action-runtime-seam-test-20261014
      - codex/w80-forward-correction-20261015
      - codex/w86-agent-executions-acl-correction-20261015
    paths:
      - .github/workflows/zavqera-w80-isolated-pgtap.yml
      - supabase/tests/w44_workspace_invitations.sql
      - supabase/tests/w46_workspace_activity.sql
      - supabase/tests/w80_invitation_helper_privileges.sql
      - supabase/tests/w83_invitation_catalog_reconciliation.sql
      - supabase/tests/w85_supabase_admin_default_acl_audit.sql
      - supabase/tests/w66_service_role_table_privilege_hardening.sql
      - supabase/tests/w86_agent_executions_acl_correction.sql
      - supabase/tests/hosted_readonly_catalog_audit_queries.sql
      - tools/supabase_readonly_catalog_audit.py
      - tests/test_supabase_readonly_catalog_audit.py
      - supabase/tests/hosted_readonly_migration_effect_audit_queries.sql
      - supabase/tests/hosted_readonly_w86_acl_provenance_query.sql
      - tools/supabase_readonly_migration_effect_audit.py
      - tests/test_supabase_readonly_migration_effect_audit.py
      - tools/review_hosted_migration_ledger.py
      - tests/test_review_hosted_migration_ledger.py
      - tests/test_w86_owner_guard_workflow_syntax.py
      - supabase/migrations/20261013100000_w80_fail_closed_workspace_role_checks.sql
      - supabase/migrations/20261015100000_w83_workspace_invitation_privilege_correction.sql
      - supabase/migrations/20261015120000_w86_agent_executions_acl_correction.sql

permissions:
  contents: read

concurrency:
  group: zavqera-w80-isolated-${{ github.ref }}
  cancel-in-progress: false

jobs:
  w80-pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout W80 source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify guarded read-only audit runner (no hosted network)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_supabase_readonly_catalog_audit.py' -v
          python3 tools/supabase_readonly_catalog_audit.py --self-test
          python3 -m unittest discover -s tests -p 'test_supabase_readonly_migration_effect_audit.py' -v
          python3 tools/supabase_readonly_migration_effect_audit.py --self-test
          python3 -m unittest discover -s tests -p 'test_review_hosted_migration_ledger.py' -v
          python3 -m unittest discover -s tests -p 'test_w86_owner_guard_workflow_syntax.py' -v

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Prepare clean local PostgreSQL 17 project
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          workdir="${RUNNER_TEMP}/zavqera-w80-local"
          mkdir -p "${workdir}"
          supabase init --workdir "${workdir}"

          python3 - "${workdir}/supabase/config.toml" <<'PY'
          from pathlib import Path
          import socket
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8").splitlines()
          for i, line in enumerate(lines):
              if line.startswith("project_id"):
                  lines[i] = 'project_id = "zavqera-w80-local"'
                  break

          def set_value(section, key, value):
              header = f"[{section}]"
              start = next((i for i, line in enumerate(lines) if line.strip() == header), None)
              if start is None:
                  lines.extend(["", header, f"{key} = {value}"])
                  return
              end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("[")), len(lines))
              for i in range(start + 1, end):
                  if lines[i].lstrip().startswith(f"{key} ="):
                      lines[i] = f"{key} = {value}"
                      return
              lines.insert(start + 1, f"{key} = {value}")

          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as listener:
              listener.bind(("127.0.0.1", 0))
              db_port = listener.getsockname()[1]
          set_value("db", "major_version", "17")
          set_value("db", "port", str(db_port))
          set_value("db.seed", "enabled", "false")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          # Match the known historical bootstrap used by the disposable W21 replay.
          # This fixture is local-only test scaffolding, not a hosted migration.
          mkdir -p "${workdir}/volumes/db/init"
          cat > "${workdir}/volumes/db/init/00_private_schema.sql" <<'SQL'
          create schema if not exists private;
          SQL

          migration_source="${GITHUB_WORKSPACE}/supabase/migrations"
          manifest="${RUNNER_TEMP}/W80_MIGRATION_MANIFEST.sha256"
          (cd "${migration_source}" && find . -maxdepth 1 -type f -name "*.sql" -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "${manifest}"
          migration_manifest_sha256="$(sha256sum "${manifest}" | awk "{print \$1}")"
          mkdir -p "${workdir}/supabase/migrations"
          cat > "${workdir}/supabase/migrations/20260921180005_e2e_historical_auth_compat.sql" <<'SQL'
          create schema if not exists private;
          create or replace function private.handle_new_user_profile()
          returns trigger
          language plpgsql
          security definer
          set search_path = pg_catalog, public
          as $body$
          begin
            insert into public.profiles (id)
            values (new.id)
            on conflict (id) do nothing;
            return new;
          end;
          $body$;
          revoke all privileges on function private.handle_new_user_profile() from public, anon, authenticated;
          create or replace function public.handle_new_user_profile()
          returns trigger
          language plpgsql
          security definer
          set search_path = pg_catalog, public
          as $body$
          begin
            insert into public.profiles (id)
            values (new.id)
            on conflict (id) do nothing;
            return new;
          end;
          $body$;
          revoke all privileges on function public.handle_new_user_profile() from public, anon, authenticated;
          drop trigger if exists on_auth_user_created on auth.users;
          create trigger on_auth_user_created
          after insert on auth.users
          for each row execute function private.handle_new_user_profile();
          SQL
          mkdir -p "${RUNNER_TEMP}/w80-all-migrations"
          cp -R "${migration_source}/." "${RUNNER_TEMP}/w80-all-migrations/"
          export LC_ALL=C
          for migration in "${migration_source}"/*.sql; do
            name="$(basename "${migration}")"
            cp "${migration}" "${workdir}/supabase/migrations/${name}"
            if [ "${name}" = "20261015100000_w83_workspace_invitation_privilege_correction.sql" ]; then
              break
            fi
          done
          if [ ! -f "${workdir}/supabase/migrations/20261015100000_w83_workspace_invitation_privilege_correction.sql" ]; then
            echo "::error::W83 invitation privilege correction was not found in the checked-in migration chain."
            exit 1
          fi
          mkdir -p "${workdir}/supabase/tests"
          cp "${GITHUB_WORKSPACE}/supabase/tests/w44_workspace_invitations.sql" \
            "${workdir}/supabase/tests/w44_workspace_invitations.sql"
          cp "${GITHUB_WORKSPACE}/supabase/tests/w46_workspace_activity.sql" \
            "${workdir}/supabase/tests/w46_workspace_activity.sql"
          cp "${GITHUB_WORKSPACE}/supabase/tests/w80_invitation_helper_privileges.sql" \
            "${workdir}/supabase/tests/w80_invitation_helper_privileges.sql"
          cp "${GITHUB_WORKSPACE}/supabase/tests/w66_service_role_table_privilege_hardening.sql" \
            "${workdir}/supabase/tests/w66_service_role_table_privilege_hardening.sql"
          cp "${GITHUB_WORKSPACE}/supabase/tests/w86_agent_executions_acl_correction.sql" \
            "${workdir}/supabase/tests/w86_agent_executions_acl_correction.sql"
          cp "${GITHUB_WORKSPACE}/supabase/tests/w84_postgres_function_default_acl_hardening.sql" \
            "${workdir}/supabase/tests/w84_postgres_function_default_acl_hardening.sql"
          cp "${GITHUB_WORKSPACE}/supabase/tests/w85_supabase_admin_default_acl_audit.sql" \
            "${workdir}/supabase/tests/w85_supabase_admin_default_acl_audit.sql"
          printf '%s\n' 'zavqera-w80-local' > "${workdir}/ZAVQERA_W80_DISPOSABLE"
          printf '%s\n' "${workdir}" > "${RUNNER_TEMP}/w80-workdir"
          {
            echo "postgres_major=17"
            echo "migration_source=checked-in supabase/migrations files"
            echo "migration_file_count=$(find "${GITHUB_WORKSPACE}/supabase/migrations" -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
            echo "verification_source_commit=$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)"
            echo "w80_migration_blob=$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD:supabase/migrations/20261013100000_w80_fail_closed_workspace_role_checks.sql)"
            echo "w83_migration_blob=$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD:supabase/migrations/20261015100000_w83_workspace_invitation_privilege_correction.sql)"
            echo "w80_test_blob=$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD:supabase/tests/w80_invitation_helper_privileges.sql)"
            echo "w84_migration_blob=$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD:supabase/migrations/20261015110000_w84_postgres_function_default_acl_hardening.sql)"
            echo "w84_test_blob=$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD:supabase/tests/w84_postgres_function_default_acl_hardening.sql)"
            echo "w86_migration_blob=$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD:supabase/migrations/20261015120000_w86_agent_executions_acl_correction.sql)"
            echo "w66_test_blob=$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD:supabase/tests/w66_service_role_table_privilege_hardening.sql)"
            echo "w86_test_blob=$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD:supabase/tests/w86_agent_executions_acl_correction.sql)"
            echo "expected_w84_pgtap_assertions=21"
            echo "expected_w66_pgtap_assertions=11"
            echo "expected_w86_pgtap_assertions=21"
            echo "w44_test_blob=$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD:supabase/tests/w44_workspace_invitations.sql)"
            echo "expected_w80_pgtap_assertions=49"
            echo "expected_w44_pgtap_assertions=17"
            echo "expected_w46_pgtap_assertions=8"
            echo "expected_catalog_snapshots=2 (post-clean-replay and post-idempotent-reapply)"
            echo "verification_source_branch=${GITHUB_REF_NAME}"
            echo "verification_source_ref=${GITHUB_REF}"
            echo "migration_manifest_sha256=${migration_manifest_sha256}"
            echo "application_schema_bootstrap=local-only private schema and historical auth-trigger compatibility fixture"
            echo "compatibility_fixture=20260921180005_e2e_historical_auth_compat.sql (not a hosted migration)"
            echo "database_source=brand-new local Supabase stack"
          } > "${RUNNER_TEMP}/W80_EVIDENCE.txt"

      - name: Replay checked-in migrations plus recorded local compatibility fixture through W83
        id: replay
        shell: bash
        run: |
          set -uo pipefail
          workdir="$(cat "${RUNNER_TEMP}/w80-workdir")"
          log="${RUNNER_TEMP}/W80_MIGRATION_REPLAY.txt"
          set +e
          supabase start --ignore-health-check \
            -x "studio,imgproxy,realtime,storage-api,postgres-meta,edge-runtime,logflare,vector,supavisor" \
            --workdir "${workdir}" 2>&1 | tee "${log}"
          status="${PIPESTATUS[0]}"
          set -e
          echo "migration_replay_through_w83_exit_code=${status}" >> "${RUNNER_TEMP}/W80_EVIDENCE.txt"
          echo "migration_replay_order=Supabase CLI timestamp order; checked-in migrations plus documented local-only historical compatibility fixture" >> "${RUNNER_TEMP}/W80_EVIDENCE.txt"
          if [ "${status}" -eq 0 ]; then
            db_container="$(docker ps --filter name=supabase_db_zavqera-w80-local --format "{{.ID}}" | head -n 1)"
            if [ -z "${db_container}" ]; then
              echo "postgres_server_version_check=FAILED_NO_DB_CONTAINER" >> "${RUNNER_TEMP}/W80_EVIDENCE.txt"
              status=1
            else
              server_version_num="$(docker exec "${db_container}" psql -U postgres -d postgres -Atqc "SHOW server_version_num" | tr -d '\r\n')"
              if [[ "${server_version_num}" =~ ^[0-9]{5,}$ ]]; then
                server_major="$((server_version_num / 10000))"
                echo "postgres_server_version_num=${server_version_num}" >> "${RUNNER_TEMP}/W80_EVIDENCE.txt"
                echo "postgres_major_observed=${server_major}" >> "${RUNNER_TEMP}/W80_EVIDENCE.txt"
                if [ "${server_major}" -ne 17 ]; then
                  echo "::error::Disposable PostgreSQL major version is not 17."
                  status=1
                fi
              else
                echo "postgres_server_version_check=FAILED_INVALID_VERSION" >> "${RUNNER_TEMP}/W80_EVIDENCE.txt"
                status=1
              fi
            fi
          fi
          exit "${status}"

      - name: Capture clean-replay state, run W44/W80, reapply W83, and repeat
        id: test_and_remainder
        shell: bash
        run: |
          set -uo pipefail
          workdir="$(cat "${RUNNER_TEMP}/w80-workdir")"
          db_container="$(docker ps --filter name=supabase_db_zavqera-w80-local --format "{{.ID}}" | head -n 1)"
          if [ -z "${db_container}" ]; then
            echo "::error::Disposable PostgreSQL container was not found for W83 idempotency verification."
            exit 1
          fi
          run_pgtap() {
            label="$1"
            test_file="$2"
            expected="$3"
            log="${RUNNER_TEMP}/${label}_PGTAP_OUTPUT.txt"
            set +e
            if [ "${label}" = "W85_SUPABASE_ADMIN_AUDIT" ]; then
              docker cp "${GITHUB_WORKSPACE}/${test_file}" "${db_container}:/tmp/w85_supabase_admin_default_acl_audit.sql"
              docker exec "${db_container}" psql -U supabase_admin -d postgres -X -qAt -v ON_ERROR_STOP=1 \
                -f /tmp/w85_supabase_admin_default_acl_audit.sql 2>&1 | tee "${log}"
              status="${PIPESTATUS[0]}"
            else
              (cd "${workdir}" && timeout 10m supabase test db --local "${test_file}") 2>&1 | tee "${log}"
              status="${PIPESTATUS[0]}"
            fi
            set -e
            planned="$(sed -n 's/^1\.\.\([0-9][0-9]*\)$/\1/p' "${log}" | tail -n 1)"
            tap_assertions="$(grep -Ec '^(ok|not ok) [0-9]+' "${log}" || true)"
            summary_tests="$(sed -nE 's/.*Tests=([0-9]+).*/\1/p' "${log}" | tail -n 1)"
            if [ -z "${planned}" ]; then planned="${summary_tests}"; fi
            failed_subtests="$(sed -nE 's/^Failed ([0-9]+)\/[0-9]+ subtests.*/\1/p' "${log}" | tail -n 1)"
            if [ -z "${failed_subtests}" ]; then
              failed_subtests="$(sed -nE 's/^Looks like you failed ([0-9]+) tests of [0-9]+.*/\1/p' "${log}" | tail -n 1)"
            fi
            failed_names="$(sed -nE 's/^# Failed test [0-9]+: "(.*)"$/\1/p' "${log}" | paste -sd ';' -)"
            if [ "${tap_assertions}" -gt 0 ]; then
              reported="${tap_assertions}"
              failed="$(grep -Ec '^not ok [0-9]+' "${log}" || true)"
            elif [ -n "${summary_tests}" ] && [ "${status}" -eq 0 ] \
              && grep -Eq '^(Result: PASS|All tests successful\.)' "${log}"; then
              reported="${summary_tests}"
              failed=0
            elif [ -n "${summary_tests}" ] && [ -n "${failed_subtests}" ]; then
              reported="${summary_tests}"
              failed="${failed_subtests}"
            else
              reported="${summary_tests:-0}"
              failed=not-reported
            fi
            {
              echo "${label,,}_pg_tap_exit_code=${status}"
              echo "${label,,}_assertions_planned=${planned:-not-reported}"
              echo "${label,,}_assertions_reported=${reported}"
              echo "${label,,}_assertions_failed=${failed}"
              echo "${label,,}_failed_test_names=${failed_names:-none}"
            } >> "${RUNNER_TEMP}/W80_EVIDENCE.txt"
            [ "${status}" -eq 0 ] && [ "${planned}" = "${expected}" ] \
              && [ "${reported}" = "${expected}" ] && [ "${failed}" = 0 ]
          }

          capture_catalog() {
            label="$1"
            log="${RUNNER_TEMP}/${label}.txt"
            docker cp "${GITHUB_WORKSPACE}/supabase/tests/w83_invitation_catalog_reconciliation.sql" \
              "${db_container}:/tmp/w83_invitation_catalog_reconciliation.sql"
            set +e
            docker exec "${db_container}" psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 \
              -f /tmp/w83_invitation_catalog_reconciliation.sql 2>&1 | tee "${log}"
            status="${PIPESTATUS[0]}"
            set -e
            echo "${label,,}_exit_code=${status}" >> "${RUNNER_TEMP}/W80_EVIDENCE.txt"
            [ "${status}" -eq 0 ]
          }

          # The clean replay has already applied W83 once. These form the
          # baseline immediately before testing idempotent reapplication.
          catalog_status=0
          capture_catalog W83_CATALOG_BEFORE_REAPPLY || catalog_status=1
          baseline_status=0
          run_pgtap W44_BEFORE_REAPPLY supabase/tests/w44_workspace_invitations.sql 17 || baseline_status=1
          run_pgtap W46_BEFORE_REAPPLY supabase/tests/w46_workspace_activity.sql 8 || baseline_status=1
          run_pgtap W80_BEFORE_REAPPLY supabase/tests/w80_invitation_helper_privileges.sql 49 || baseline_status=1

          docker cp "${GITHUB_WORKSPACE}/supabase/migrations/20261015100000_w83_workspace_invitation_privilege_correction.sql" \
            "${db_container}:/tmp/w83_workspace_invitation_privilege_correction.sql"
          set +e
          docker exec "${db_container}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f /tmp/w83_workspace_invitation_privilege_correction.sql 2>&1 | tee -a "${RUNNER_TEMP}/W80_MIGRATION_REPLAY.txt"
          reapply_status="${PIPESTATUS[0]}"
          set -e
          echo "w83_idempotent_reapply_exit_code=${reapply_status}" >> "${RUNNER_TEMP}/W80_EVIDENCE.txt"
          if [ "${reapply_status}" -ne 0 ]; then
            echo "::error::Reapplying the W83 correction on the disposable database failed."
            exit "${reapply_status}"
          fi

          regression_status=0
          capture_catalog W83_CATALOG_AFTER_REAPPLY || regression_status=1
          run_pgtap W44_AFTER_REAPPLY supabase/tests/w44_workspace_invitations.sql 17 || regression_status=1
          run_pgtap W46_AFTER_REAPPLY supabase/tests/w46_workspace_activity.sql 8 || regression_status=1
          run_pgtap W80_AFTER_REAPPLY supabase/tests/w80_invitation_helper_privileges.sql 49 || regression_status=1
          if [ "${catalog_status}" -ne 0 ] || [ "${baseline_status}" -ne 0 ]; then
            echo "::error::The clean-replay catalog snapshot or pre-reapply pgTAP baseline failed."
            regression_status=1
          fi
          if [ "${regression_status}" -ne 0 ]; then
            echo "::error::One or more invitation pgTAP regressions failed."
          fi

          # Apply every later checked-in migration only after the W83 dependency point.
          # This preserves the tested dependency point and still reports full-chain drift.
          cp -R "${RUNNER_TEMP}/w80-all-migrations/." "${workdir}/supabase/migrations/"
          replay_log="${RUNNER_TEMP}/W80_MIGRATION_REPLAY.txt"
          set +e
          supabase migration up --local --workdir "${workdir}" 2>&1 | tee -a "${replay_log}"
          later_status="${PIPESTATUS[0]}"
          set -e
          echo "migration_replay_after_w83_exit_code=${later_status}" >> "${RUNNER_TEMP}/W80_EVIDENCE.txt"
          if [ "${later_status}" -ne 0 ]; then
            echo "::error::The remaining checked-in migration chain failed after W83."
          fi

          # W84 guards the future-function defaults set by role postgres. Reapply it
          # in the disposable PG17 stack and rerun all assertions to establish idempotency.
          w84_status=0
          w85_status=0
          w86_status=0
          if [ "${later_status}" -eq 0 ]; then
            run_pgtap W84_AFTER_CHAIN supabase/tests/w84_postgres_function_default_acl_hardening.sql 21 || w84_status=1
            docker cp "${GITHUB_WORKSPACE}/supabase/migrations/20261015110000_w84_postgres_function_default_acl_hardening.sql" \
              "${db_container}:/tmp/w84_postgres_function_default_acl_hardening.sql"
            set +e
            docker exec "${db_container}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -f /tmp/w84_postgres_function_default_acl_hardening.sql 2>&1 | tee -a "${replay_log}"
            w84_reapply_status="${PIPESTATUS[0]}"
            set -e
            echo "w84_idempotent_reapply_exit_code=${w84_reapply_status}" >> "${RUNNER_TEMP}/W80_EVIDENCE.txt"
            if [ "${w84_reapply_status}" -ne 0 ]; then
              echo "::error::Reapplying W84 on the disposable database failed."
              w84_status=1
            fi
            run_pgtap W84_AFTER_REAPPLY supabase/tests/w84_postgres_function_default_acl_hardening.sql 21 || w84_status=1
            run_pgtap W85_SUPABASE_ADMIN_AUDIT supabase/tests/w85_supabase_admin_default_acl_audit.sql 12 || w85_status=1
            # Negative-control test: recreate the hosted ACL drift locally, then
            # prove W86 actively repairs it. Never run this on hosted Supabase.
            cat > "${RUNNER_TEMP}/W86_SIMULATED_DRIFT_SEED.sql" <<'SQL'
          grant all privileges on table public.agent_executions to service_role;
          do $seed$
          declare
            target_column text;
          begin
            select a.attname into target_column
              from pg_attribute a
             where a.attrelid = 'public.agent_executions'::regclass
               and a.attnum > 0 and not a.attisdropped
             order by a.attnum
             limit 1;
            if target_column is null then
              raise exception 'W86 drift seed cannot locate a live agent_executions column';
            end if;
            execute format(
              'grant all privileges (%I) on table public.agent_executions to service_role',
              target_column
            );
          end
          $seed$;
          SQL
            set +e
            docker cp "${RUNNER_TEMP}/W86_SIMULATED_DRIFT_SEED.sql" "${db_container}:/tmp/W86_SIMULATED_DRIFT_SEED.sql"
            seed_copy_status=$?
            if [ "$seed_copy_status" -eq 0 ]; then
              docker exec "${db_container}" psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 \
                -f /tmp/W86_SIMULATED_DRIFT_SEED.sql 2>&1 | tee "${RUNNER_TEMP}/W86_SIMULATED_DRIFT_SEED_OUTPUT.txt"
              seed_status="${PIPESTATUS[0]}"
            else
              seed_status="$seed_copy_status"
            fi
            set -e
            echo "w86_simulated_drift_seed_exit_code=${seed_status}" >> "${RUNNER_TEMP}/W80_EVIDENCE.txt"
            if [ "${seed_status}" -ne 0 ]; then
              echo "::error::Unable to create the disposable W86 drift fixture."
              w86_status=1
            else
              # Verify the fixture reproduced the important hosted privileges and
              # stored column-level ACL before applying the correction.
              set +e
              docker exec "${db_container}" psql -U postgres -d postgres -X -qAt -v ON_ERROR_STOP=1 -c "
                SELECT CASE
                  WHEN has_table_privilege('service_role','public.agent_executions','INSERT')
                   AND has_table_privilege('service_role','public.agent_executions','UPDATE')
                   AND has_table_privilege('service_role','public.agent_executions','DELETE')
                   AND has_table_privilege('service_role','public.agent_executions','TRUNCATE')
                   AND has_table_privilege('service_role','public.agent_executions','MAINTAIN')
                   AND EXISTS (
                     SELECT 1 FROM pg_attribute a
                     CROSS JOIN LATERAL aclexplode(a.attacl) acl
                     WHERE a.attrelid = 'public.agent_executions'::regclass
                       AND a.attnum > 0 AND NOT a.attisdropped
                       AND acl.grantee = 'service_role'::regrole
                       AND acl.privilege_type IN ('SELECT','INSERT','UPDATE','REFERENCES')
                   )
                  THEN 'W86_DRIFT_FIXTURE_PASS' ELSE 'W86_DRIFT_FIXTURE_FAIL' END" \
                2>&1 | tee "${RUNNER_TEMP}/W86_DRIFT_FIXTURE_CHECK.txt"
